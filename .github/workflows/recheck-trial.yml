name: recheck trial

# A trial in a fork, not for upstream as it stands: build with the shared cache on a GitHub-hosted
# runner as build.yml does, then give every theorem and definition back to the kernel from a file
# that is not a module (scripts/Recheck.lean), and record how long that takes.

on:
  push:
    branches: ['ci/recheck-trial*']

permissions:
  contents: read

jobs:
  recheck:
    name: build and re-check
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      UPSTREAM: https://github.com/leanprover-community/riemann-hypothesis.git
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Machine
        run: |
          nproc
          free -g
          df -h . | tail -1
          cat .recheck-base

      - name: Fetch history for the cache baseline
        run: git fetch --no-tags --depth=200 "$UPSTREAM" "+$(cat .recheck-base):refs/ci/cache-baseline"

      - name: Install elan and the toolchain in lean-toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version

      - name: Restore Mathlib's cache
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe mathlib/cache get

      - name: Restore Tau Ceti's cache
        run: python3 scripts/tauceti-cache-get.py

      - name: Restore this project's cache
        run: |
          ulimit -Sn "$(ulimit -Hn)"
          status=0
          python3 scripts/ci-cache-get.py --baseline refs/ci/cache-baseline || status=$?
          case "$status" in
            0) echo "::notice::Restored the cache for these exact build inputs." ;;
            4) echo "::notice::Restored a baseline cache; lake build compiles what changed since." ;;
            3) echo "::warning::No cache record matches; lake build compiles every module." ;;
            *) exit "$status" ;;
          esac

      - name: lake build
        run: |
          set -o pipefail
          start=$(date +%s)
          lake build 2>&1 | tee build.log
          echo "lake build: $(( $(date +%s) - start )) seconds"
          if grep -n -e 'declaration uses `sorry`' -e "declaration uses 'sorry'" build.log; then
            echo "::error::The build reports declarations that use sorry."
            exit 1
          fi

      - name: Check the axioms of the five theorems
        run: |
          set -o pipefail
          lake env lean scripts/PrintAxioms.lean 2>&1 | tee axioms.log
          axioms='depends on axioms: [propext, Classical.choice, Quot.sound]'
          printf "'%s' $axioms\n" riemannHypothesis riemannZeta_eq_zero_re LFunction_ne_zero_of_half_lt_re \
            LFunction_eq_zero_re LFunction_eq_zero_re_of_isPrimitive > expected-axioms.log
          diff -u expected-axioms.log axioms.log

      - name: Re-check Tau Ceti, one process
        run: |
          start=$(date +%s)
          RECHECK_OUT=recheck-tauceti.out RECHECK_ROOTS=TauCeti \
            /usr/bin/time -v lake env lean -DmaxHeartbeats=4000000 --tstack=400000 scripts/Recheck.lean \
            > recheck-tauceti.log 2>&1 || echo "the re-check of Tau Ceti exited with $?"
          echo "wall seconds: $(( $(date +%s) - start ))"
          tail -1 recheck-tauceti.out
          grep -E 'Elapsed|Maximum resident' recheck-tauceti.log

      - name: Re-check the project, one process
        # One process at a time: on main at 8c828eda the Tau Ceti pass alone reached 8.8 GB of
        # resident memory, and two passes side by side were killed on this 15 GB runner.
        run: |
          start=$(date +%s)
          RECHECK_OUT=recheck-project.out RECHECK_ROOTS=Lib,New,Main,Statements \
            /usr/bin/time -v lake env lean -DmaxHeartbeats=4000000 --tstack=400000 scripts/Recheck.lean \
            > recheck-project.log 2>&1 || echo "the re-check of the project exited with $?"
          echo "wall seconds: $(( $(date +%s) - start ))"
          tail -1 recheck-project.out
          grep -E 'Elapsed|Maximum resident' recheck-project.log

      - name: Summary
        if: always()
        run: |
          echo "rejected declarations: $(cat recheck-*.out | grep -c '^FAIL' || true)"
          echo "by module:"
          grep -h '^FAIL' recheck-*.out | cut -f3 | sort | uniq -c | sort -rn | head -80 || true
          echo "first rejections:"
          grep -h '^FAIL' recheck-*.out | head -5 | cut -c1-500 || true
          echo "slowest accepted declarations (ms):"
          grep -h '^SLOW' recheck-*.out | sort -t"$(printf '\t')" -k2,2nr | head -20 || true
          grep -h '^DONE' recheck-*.out || true
          tail -3 recheck-*.log | cut -c1-400 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recheck-${{ github.sha }}
          path: |
            recheck-*.out
            recheck-*.log
            build.log
            axioms.log
          retention-days: 14

      - name: Result
        run: |
          for f in recheck-tauceti.out recheck-project.out; do
            grep -q '^DONE' "$f" || { echo "::error::$f is incomplete."; exit 1; }
          done
          if grep -q '^FAIL' recheck-*.out; then
            echo "::error::The kernel rejected declarations."
            exit 1
          fi
