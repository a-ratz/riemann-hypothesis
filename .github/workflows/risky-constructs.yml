name: risky constructs

# The full build passes when a proof uses `sorry` and when a pull request declares an axiom: the
# first only warns, and the second compiles silently. This fails a pull request that adds one of
# the words listed in scripts/risky-constructs.py to a Lean file under src/. It is a plain search
# of the text, comments included. scripts/risky-constructs-allowed.txt holds the lines that may
# stand.
#
# Like challenge-files.yml, this is a pull_request_target workflow. GitHub takes the workflow
# from the default branch, whatever branch a pull request is opened against, and the checkout
# below takes the script and the list of lines that may stand from there too. The pull request's
# commits are fetched as git objects and read. Nothing from the pull request is checked out or
# run, so a pull request cannot switch the check off or allow itself, and it needs no approval to
# run on a pull request from a fork.
#
# A run reads the list as it stood when the run started, and a re-run starts from the same
# commit. After a line is added to the list, a pull request that was reported stays red until
# its next push or edit, or until it is closed and opened again.
#
# A text search is not a proof. It catches the accident; the axiom check in Comparator is what
# counts.

on:
  pull_request_target:
    # `edited` is there for a pull request that is given another base branch. Every edit runs
    # the scan: a run that skipped its job would count as passed and would replace a failed one.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to check
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read

# A run started by hand has a group of its own, so that it does not cancel the pull request's run.
concurrency:
  group: risky-constructs-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  scan:
    name: No risky construct is added
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the trusted script and its list of lines that may stand
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/risky-constructs.py
            scripts/risky-constructs-allowed.txt
          sparse-checkout-cone-mode: false
      - name: Look for lines with a risky word that the pull request adds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request's event names the commits it is about. Asking the API at run time
          # could answer with an older head just after a push. Only a run started by hand asks.
          if [ -z "$HEAD" ]; then
            BASE=$(gh api "repos/$REPO/pulls/$PR" --jq .base.sha)
            HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          fi
          python3 scripts/risky-constructs.py --annotate --work "$RUNNER_TEMP/pull" \
            --remote "https://github.com/$REPO" --base "$BASE" --head "$HEAD"
